<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="seaGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0F172A" />
            <stop offset="100%" stop-color="#1E293B" />
        </linearGradient>
        
        <linearGradient id="landGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="100%" stop-color="#1E293B" />
        </linearGradient>

        <linearGradient id="activityGradient" x1="20%" y1="80%" x2="80%" y2="20%">
            <stop offset="0%" stop-color="#fe8e0b" /> <stop offset="100%" stop-color="#a60a2d" /> </linearGradient>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="coloredBlur" /> <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        
        <pattern id="gridPattern" width="50" height="50" patternUnits="userSpaceOnUse">
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
        </pattern>
    </defs>

    <rect width="1200" height="600" fill="url(#seaGradient)" />
    <rect width="1200" height="600" fill="url(#gridPattern)" />

    <path d="M1200 600 L 400 600 C 350 550, 450 450, 300 400 C 150 350, 200 200, 50 150 L 0 100 L 0 0 L 1200 0 Z" fill="url(#landGradient)" stroke="#475569" stroke-width="2"/>
    <path d="M100 450 C 150 420, 200 480, 150 520 C 100 550, 50 500, 100 450 Z" fill="url(#landGradient)" stroke="#475569" stroke-width="2" opacity="0.7"/>


    <g filter="url(#glow)">
        <g stroke="url(#activityGradient)" stroke-width="3" stroke-linecap="round" opacity="0.7">
            <line x1="700" y1="250" x2="300" y2="400" />
            <line x1="700" y1="250" x2="900" y2="150" />
            <line x1="700" y1="250" x2="650" y2="500" />
            <line x1="300" y1="400" x2="150" y2="520" />
             <path d="M 500 200 C 600 100, 800 150, 900 300" fill="none" stroke-width="2" stroke-dasharray="10 5"/>
        </g>

        <g fill="url(#activityGradient)">
            <circle cx="700" cy="250" r="15" /> <circle cx="300" cy="400" r="8" />
            <circle cx="900" cy="150" r="8" />
            <circle cx="650" cy="500" r="6" />
            <circle cx="150" cy="520" r="6" />
        </g>
        
        <circle cx="700" cy="250" r="60" fill="none" stroke="url(#activityGradient)" stroke-width="1.5" opacity="0.4">
            <animate attributeName="r" from="20" to="120" dur="3s" repeatCount="indefinite" />
            <animate attributeName="opacity" from="0.8" to="0" dur="3s" repeatCount="indefinite" />
        </circle>
    </g>

    <g transform="translate(700, 250)">
        <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="48" fill="#FFFFFF" letter-spacing="2" filter="url(#glow)">LEEK</text>
    </g>
    
    <text x="1150" y="550" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" opacity="0.8" letter-spacing="1">LOODE-EESTI</text>
    <text x="1150" y="580" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="#fe8e0b" opacity="1">ETTEVÕTLUSKLUBI</text>

</svg>